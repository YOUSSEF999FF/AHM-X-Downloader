name: Render Web Service Health Ping

on:
  schedule:
    # Every 10 minutes. Scheduled workflows may be delayed by GitHub.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-health-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate the configured health URL
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          set -eu
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "Missing GitHub repository variable RENDER_HEALTH_URL. Set it to https://YOUR-SERVICE.onrender.com/health"
            exit 1
          fi
          case "$HEALTH_URL" in
            https://*/health) ;;
            *) echo "RENDER_HEALTH_URL must be your HTTPS service URL ending in /health"; exit 1 ;;
          esac

      - name: Ping Render health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          set -eu
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "Health ping attempt $attempt/3"
            if curl --fail --silent --show-error --location --max-time 25 "$HEALTH_URL"; then
              echo
              echo "Health endpoint responded."
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "Health endpoint did not respond successfully after 3 attempts."
          exit 1
