services:
  - type: web
    name: ahm-x-downloader-bot-v3
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        value: ""
      - key: ALLOWED_USER_IDS
        value: ""
      - key: MAX_UPLOAD_MB
        value: "47"
      - key: MAX_VIDEO_HEIGHT
        value: "1080"
      - key: MAX_ACTIVE_DOWNLOADS
        value: "1"
      - key: REQUEST_COOLDOWN_SECONDS
        value: "5"
      - key: LOG_LEVEL
        value: INFO
      - key: YTDLP_NODE_PATH
        value: /usr/local/bin/node
